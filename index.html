<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contador de palabras online</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 30px 20px;
            background: #f5f5f5;
            color: #222;
        }

        h1 {
            text-align: center;
        }

        .descripcion {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 300px;
            padding: 15px;
            box-sizing: border-box;
            font-size: 17px;
            border: 1px solid #ccc;
            border-radius: 12px;
            resize: vertical;
        }

        .resultados {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .resultado {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .numero {
            font-size: 30px;
            font-weight: bold;
            margin-top: 5px;
        }

        @media (max-width: 500px) {
            .resultados {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>🧮 Contador de palabras</h1>

    <p class="descripcion">
        Escribe o pega tu texto y descubre cuántas palabras y caracteres tiene.
    </p>

    <textarea id="texto" placeholder="Escribe o pega tu texto aquí..."></textarea>

    <div class="resultados">

        <div class="resultado">
            <div>Palabras</div>
            <div class="numero" id="palabras">0</div>
        </div>

        <div class="resultado">
            <div>Caracteres</div>
            <div class="numero" id="caracteres">0</div>
        </div>

        <div class="resultado">
            <div>Sin espacios</div>
            <div class="numero" id="sinEspacios">0</div>
        </div>

        <div class="resultado">
            <div>Frases</div>
            <div class="numero" id="frases">0</div>
        </div>

    </div>

    <script>
        const texto = document.getElementById("texto");

        texto.addEventListener("input", function() {

            const contenido = texto.value;

            document.getElementById("caracteres").textContent =
                contenido.length;

            document.getElementById("sinEspacios").textContent =
                contenido.replace(/\s/g, "").length;

            const palabras = contenido.trim() === ""
                ? []
                : contenido.trim().split(/\s+/);

            document.getElementById("palabras").textContent =
                palabras.length;

            const frases = contenido.match(/[.!?]+/g);

            document.getElementById("frases").textContent =
                frases ? frases.length : 0;
        });
    </script>

</body>
</html>
